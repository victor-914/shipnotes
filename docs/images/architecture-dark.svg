<path class="a" d="M984 290 V202 H1000" marker-end="url(#ah)"/>
<text class="gl" x="20" y="374">YOU</text>
<rect class="you" x="36" y="384" width="148" height="64" rx="8"/>
<text class="t" x="110" y="413.5" text-anchor="middle">Publish a snapshot</text>
<text class="s" x="110" y="429.5" text-anchor="middle">for each project</text>
<rect class="you" x="378" y="384" width="238" height="64" rx="8"/>
<text class="t" x="497" y="413.5" text-anchor="middle">Set up once</text>
<text class="s" x="497" y="429.5" text-anchor="middle">config · VOICE.md · Claude token</text>
