<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" width="1120" height="510" role="img" aria-labelledby="title desc">
<title id="title">shipnotes architecture</title>
<desc id="desc">Your projects publish an Outcome Snapshot and commits. shipnotes, running in GitHub Actions, collects them, finds which public metrics moved, turns them into facts, asks Claude Code for topics and drafts, and fact-checks every number. It opens a Post ideas Issue and draft pull requests in your content repo. When you merge, the post moves to published/ and goes to your site and channels.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .bg { fill: #0d1117; }
  .g { fill: #161b22; stroke: #30363d; stroke-width: 1; }
  .gl { fill: #9198a1; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
  .box { fill: #0d1117; stroke: #6e7681; stroke-width: 1.2; }
  .claude { fill: #33201a; stroke: #e08a63; stroke-width: 1.5; }
  .check { fill: #0f2d1a; stroke: #3fb950; stroke-width: 1.5; }
  .you { fill: #0c2d4f; stroke: #4493f8; stroke-width: 1.3; stroke-dasharray: 5 4; }
  .t { fill: #e6edf3; font-size: 14px; font-weight: 600; }
  .s { fill: #9198a1; font-size: 11.5px; }
  .l { fill: #9198a1; font-size: 11px; }
  .a { fill: none; stroke: #8b949e; stroke-width: 1.4; }
  .ah { fill: #8b949e; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker></defs>
