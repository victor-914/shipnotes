<rect class="box" x="36" y="84" width="148" height="70" rx="8"/>
<text class="t" x="110" y="109" text-anchor="middle">Outcome Snapshot</text>
<text class="s" x="110" y="125" text-anchor="middle">outcomes.json</text>
<text class="s" x="110" y="140" text-anchor="middle">totals only</text>
<rect class="box" x="36" y="184" width="148" height="70" rx="8"/>
<text class="t" x="110" y="209" text-anchor="middle">Project repos</text>
<text class="s" x="110" y="225" text-anchor="middle">commits become</text>
<text class="s" x="110" y="240" text-anchor="middle">“shipped” items</text>
<text class="l" x="110" y="292" text-anchor="middle">Private metrics</text>
<text class="l" x="110" y="308" text-anchor="middle">never leave here</text>
<rect class="g" x="230" y="40" width="520" height="300" rx="12"/>
<text class="gl" x="246" y="64">SHIPNOTES · IN YOUR GITHUB ACTIONS</text>
<rect class="box" x="250" y="84" width="110" height="70" rx="8"/>
<text class="t" x="305" y="116.5" text-anchor="middle">Collect</text>
<text class="s" x="305" y="132.5" text-anchor="middle">fetch + validate</text>
<rect class="box" x="378" y="84" width="110" height="70" rx="8"/>
<text class="t" x="433" y="109" text-anchor="middle">Find stories</text>
<text class="s" x="433" y="125" text-anchor="middle">what moved,</text>
<text class="s" x="433" y="140" text-anchor="middle">ranked</text>
<rect class="box" x="506" y="84" width="110" height="70" rx="8"/>
<text class="t" x="561" y="109" text-anchor="middle">Facts</text>
<text class="s" x="561" y="125" text-anchor="middle">public metrics</text>
<text class="s" x="561" y="140" text-anchor="middle">only</text>
<rect class="check" x="634" y="84" width="100" height="70" rx="8"/>
<text class="t" x="684" y="109" text-anchor="middle">Fact-check</text>
<text class="s" x="684" y="125" text-anchor="middle">every number</text>
<text class="s" x="684" y="140" text-anchor="middle">from facts</text>
<rect class="claude" x="378" y="200" width="238" height="90" rx="8"/>
<text class="t" x="497" y="227.5" text-anchor="middle">Claude Code</text>
<text class="s" x="497" y="243.5" text-anchor="middle">topics · drafts · rewrites</text>
<text class="s" x="497" y="258.5" text-anchor="middle">channel versions</text>
<text class="s" x="497" y="273.5" text-anchor="middle">no tools · no secrets</text>
