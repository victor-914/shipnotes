<text class="t" x="880" y="199.5" text-anchor="middle">Draft pull request</text>
<text class="s" x="880" y="215.5" text-anchor="middle">drafts/*.md · status</text>
<rect class="box" x="796" y="260" width="168" height="60" rx="8"/>
<text class="t" x="880" y="287.5" text-anchor="middle">published/</text>
<text class="s" x="880" y="303.5" text-anchor="middle">approved posts</text>
<path class="a" d="M734 119 H792" marker-end="url(#ah)"/>
<path class="a" d="M760 119 V202 H792" marker-end="url(#ah)"/>
<text class="l" x="747" y="76" text-anchor="middle">GitHub API</text>
<path class="a" d="M880 144 V168" marker-end="url(#ah)"/>
<text class="l" x="888" y="161" text-anchor="start">pick a topic</text>
