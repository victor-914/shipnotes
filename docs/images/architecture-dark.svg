<text class="t" x="880" y="406" text-anchor="middle">Review</text>
<text class="s" x="880" y="422" text-anchor="middle">tick, edit, /shipnotes</text>
<text class="s" x="880" y="437" text-anchor="middle">rewrite, merge</text>
